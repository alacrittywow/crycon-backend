<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>Crycon</title>
  <link rel="stylesheet" href="./style.css">
  <script src="./app.js" defer></script>
</head>
<body>
  <div class="shell">
    <header class="masthead">
      <a href="#search" class="wordmark">CRYCON</a>
      <span class="demo" id="data-mode">Demo data</span>
    </header>
    <main id="main">
      <section id="search-view" aria-label="Search">
        <form id="search-form" role="search">
          <label class="sr-only" for="query">Search by handle, wallet or ENS</label>
          <input id="query" type="search" placeholder="Handle, wallet or ENS" maxlength="200" autocomplete="off" spellcheck="false">
          <button type="submit">Search</button>
        </form>
        <p id="search-status" role="status" class="sr-only"></p>
        <div id="results"></div>
      </section>
      <section id="candidates-view" aria-labelledby="candidates-title" hidden>
        <h1 id="candidates-title" class="section-heading">Candidates</h1>
        <div id="directory"></div>
      </section>
      <section id="jobs-view" aria-labelledby="jobs-title" hidden>
        <h1 id="jobs-title" class="section-heading">Jobs</h1>
        <p class="empty">Job history is available to administrators via the API.</p>
      </section>
    </main>
    <nav aria-label="Main navigation">
      <a href="#search" aria-current="page">Search</a>
      <a href="#candidates">Candidates</a>
      <a href="#jobs">Jobs</a>
    </nav>
  </div>
  <template id="profile-template">
    <article>
      <div class="profile">
        <div class="profile-name">
          <span class="initials" aria-hidden="true"></span>
          <div><h1></h1><p class="handle mono"></p></div>
        </div>
        <details class="score">
          <summary><strong></strong><span>Confidence</span></summary>
          <div class="score-detail">An estimate based on public signals. It does not establish identity or wallet ownership.</div>
        </details>
      </div>
      <div class="wallets"></div>
      <section class="sources" aria-label="Sources">
        <h2 class="section-heading">Sources</h2>
        <ul></ul>
      </section>
    </article>
  </template>
</body>
</html>
