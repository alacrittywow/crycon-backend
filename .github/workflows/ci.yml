name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CRYCON_ENV_FILE: ""
      CRYCON_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/crycon_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: crycon_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d crycon_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile Python sources
        run: python -m compileall -q src tests *.py
      - name: Run unit and PostgreSQL integration tests
        run: python -m pytest -q
